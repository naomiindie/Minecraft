<!DOCTYPE html>
<html lang="ja">
<head>
    <title>Minecraft Mobile</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; touch-action: none; font-family: sans-serif; user-select: none; -webkit-user-select: none; }
        #mobile-ui { display: none; position: fixed; inset: 0; z-index: 10; pointer-events: none; }
        #mobile-ui.active { display: block; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; background: white; border-radius: 50%; border: 1px solid black; }
        #look-zone { position: absolute; top: 0; right: 0; width: 50%; height: 100%; pointer-events: auto; }
        #joystick-zone { position: absolute; left: 20px; bottom: 20px; width: 120px; height: 120px; pointer-events: auto; }
        #action-buttons { position: absolute; right: 20px; bottom: 20px; display: flex; gap: 10px; pointer-events: auto; }
        .btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(0,0,0,0.5); color: white; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; border: 2px solid white; cursor: pointer; }
        #btn-place { background: rgba(46,160,90,0.7); }
        #btn-break { background: rgba(200,60,50,0.7); }
        #btn-jump { background: rgba(40,100,200,0.7); height: 50px; align-self: flex-end; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: #333; font-size: 14px; font-weight: bold; pointer-events: none; }
    </style>
</head>
<body>
    <div id="info">Minecraft Mobile Clone</div>
    <div id="mobile-ui">
        <div id="crosshair"></div>
        <div id="look-zone"></div>
        <div id="joystick-zone"></div>
        <div id="action-buttons">
            <div class="btn" id="btn-break">壊す</div>
            <div class="btn" id="btn-jump">ジャンプ</div>
            <div class="btn" id="btn-place">置く</div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.1/dist/nipplejs.min.js"></script>
    <script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
    <script type="module">
        import * as THREE from 'three';
        
        let camera, scene, renderer, plane, raycaster, rollOverMesh, cubeGeo, cubeMaterial;
        const objects = [];
        const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        
        let moveVector = {x:0, y:0}, yaw = 0, pitch = -0.1, lookTouchId = null, lastLookX = 0, lastLookY = 0;
        let isJumping = false, jumpStart = 0;
        const clock = new THREE.Clock();

        init();

        function init() {
            camera = new THREE.PerspectiveCamera( 50, window.innerWidth/window.innerHeight, 1, 10000 );
            camera.position.set(0, 150, 400); 
            camera.rotation.order = 'YXZ';
            camera.rotation.set(pitch, yaw, 0);

            scene = new THREE.Scene(); 
            scene.background = new THREE.Color(0x87CEEB);
            
            const rollOverGeo = new THREE.BoxGeometry(50, 50, 50);
            rollOverMesh = new THREE.Mesh(rollOverGeo, new THREE.MeshBasicMaterial({color: 0xff0000, opacity: 0.5, transparent: true}));
            scene.add(rollOverMesh);

            cubeGeo = new THREE.BoxGeometry(50, 50, 50);
            cubeMaterial = new THREE.MeshLambertMaterial({color: 0x8fce00}); // Solid green, no texture
            const edges = new THREE.EdgesGeometry(cubeGeo);
            const lineMat = new THREE.LineBasicMaterial({color: 0x000000, linewidth: 2});
            
            window.createBlock = function() {
                const g = new THREE.Group();
                g.add(new THREE.Mesh(cubeGeo, cubeMaterial));
                g.add(new THREE.LineSegments(edges, lineMat));
                return g;
            };

            scene.add(new THREE.GridHelper(1000, 20));
            raycaster = new THREE.Raycaster();
            
            plane = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000).rotateX(-Math.PI/2), new THREE.MeshBasicMaterial({visible:false}));
            scene.add(plane); 
            objects.push(plane);

            scene.add(new THREE.AmbientLight(0x606060));
            const dirLight = new THREE.DirectionalLight(0xffffff);
            dirLight.position.set(1, 0.75, 0.5).normalize();
            scene.add(dirLight);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            if (isMobile) {
                document.getElementById('mobile-ui').classList.add('active');
                setupMobile();
                renderer.setAnimationLoop(animate);
            } else {
                // Desktop fallback controls could go here, but focusing on mobile.
                 renderer.setAnimationLoop(animate);
            }
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setupMobile() {
            const joystick = nipplejs.create({zone: document.getElementById('joystick-zone'), mode: 'static', position: {left:'50%', top:'50%'}, color: 'white'});
            joystick.on('move', (e, data) => { moveVector = data.vector || {x:0, y:0}; });
            joystick.on('end', () => { moveVector = {x:0, y:0}; });

            const lookZone = document.getElementById('look-zone');
            lookZone.addEventListener('touchstart', e => { 
                lookTouchId = e.changedTouches[0].identifier; 
                lastLookX = e.changedTouches[0].clientX; 
                lastLookY = e.changedTouches[0].clientY; 
                e.preventDefault(); 
            }, {passive:false});
            
            lookZone.addEventListener('touchmove', e => {
                for(let t of e.changedTouches) {
                    if(t.identifier === lookTouchId) {
                        yaw -= (t.clientX - lastLookX) * 0.004;
                        pitch = Math.max(-1.5, Math.min(1.5, pitch - (t.clientY - lastLookY) * 0.004));
                        camera.rotation.set(pitch, yaw, 0);
                        lastLookX = t.clientX; 
                        lastLookY = t.clientY;
                    }
                }
                e.preventDefault();
            }, {passive:false});
            
            lookZone.addEventListener('touchend', e => { for(let t of e.changedTouches) if(t.identifier === lookTouchId) lookTouchId = null; });

            document.getElementById('btn-place').addEventListener('touchstart', e => { 
                e.preventDefault(); 
                const i = getIntersect(); 
                if(i) { 
                    const v = window.createBlock(); 
                    v.position.copy(rollOverMesh.position); 
                    const h = new THREE.Mesh(cubeGeo, new THREE.MeshBasicMaterial({visible:false})); 
                    v.add(h); 
                    scene.add(v); 
                    objects.push(h); 
                } 
            }, {passive:false});
            
            document.getElementById('btn-break').addEventListener('touchstart', e => { 
                e.preventDefault(); 
                raycaster.setFromCamera({x:0,y:0}, camera); 
                const i = raycaster.intersectObjects(objects); 
                if(i.length>0 && i[0].object!==plane){ 
                    scene.remove(i[0].object.parent); 
                    objects.splice(objects.indexOf(i[0].object),1); 
                } 
            }, {passive:false});
            
            document.getElementById('btn-jump').addEventListener('touchstart', e => { 
                e.preventDefault(); 
                if(!isJumping){ isJumping=true; jumpStart=performance.now(); } 
            }, {passive:false});
        }

        function getIntersect() {
            raycaster.setFromCamera({x:0, y:0}, camera);
            const i = raycaster.intersectObjects(objects);
            if(i.length > 0) {
                rollOverMesh.visible = true;
                rollOverMesh.position.copy(i[0].point).add(i[0].face.normal).divideScalar(50).floor().multiplyScalar(50).addScalar(25);
                return i[0];
            }
            rollOverMesh.visible = false; 
            return null;
        }

        function animate() {
            const delta = clock.getDelta();
            
            if(moveVector.x !== 0 || moveVector.y !== 0) {
                const speed = 300 * delta;
                const forward = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0,yaw,0));
                const right = new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,yaw,0));
                camera.position.addScaledVector(forward, moveVector.y * speed);
                camera.position.addScaledVector(right, moveVector.x * speed);
            }
            
            if(isJumping) {
                const t = (performance.now() - jumpStart) / 400;
                if(t >= 1) { 
                    isJumping = false; 
                    camera.position.y = 150; 
                } else { 
                    camera.position.y = 150 + Math.sin(t * Math.PI) * 80; 
                }
            }
            
            getIntersect();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
